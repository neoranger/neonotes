services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neonotes-backend
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - DATA_DIR=/app/data
      - JWT_SECRET=neonotes_production_jwt_secret_key_2026
    volumes:
      - ./neonotes-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neonotes-frontend
    restart: unless-stopped
    ports:
      - "4500:80"
    depends_on:
      - backend

