services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neonotes-backend
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      - PORT=7000
      - DATA_DIR=/app/data
      - JWT_SECRET=${JWT_SECRET:-neonotes_local_dev_secret_only}
    volumes:
      - ./neonotes-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neonotes-frontend
    restart: unless-stopped
    ports:
      - "4500:80"
    depends_on:
      - backend

